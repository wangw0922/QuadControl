name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 跑在本机自托管 runner 上（私有仓库不计 Actions 分钟）：
#   qc-ubuntu = 本地 Ubuntu 22.04 arm64 虚拟机，qc-macos = 本机 macOS arm64。
# PR 只跑 ubuntu；push main 与手动触发跑 ubuntu + macOS。
# Windows 暂无本地 runner，全矩阵里已移除——Windows 验证（含 G2 Job Object 真机）
# 仍待 Actions 配额恢复或接入 Windows 主机后补。
# 仓库公开后，fork 提的 PR 默认不在自托管 runner 上跑（避免陌生代码在本机执行）；
# 只有源仓库自己分支的 PR、push 到 main、或手动触发才会实际执行 job。
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["qc-ubuntu"]' || '["qc-ubuntu", "qc-macos"]') }}
    runs-on: [self-hosted, "${{ matrix.os }}"]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Persist cargo output across runs
        shell: bash
        run: echo "CARGO_TARGET_DIR=$(dirname "$GITHUB_WORKSPACE")/cargo-target" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Validate workspace metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Check formatting
        if: matrix.os == 'qc-ubuntu'
        run: cargo fmt --all --check

      - name: Run Clippy
        if: matrix.os == 'qc-ubuntu'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

  gui:
    name: GUI (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["qc-ubuntu"]' || '["qc-ubuntu", "qc-macos"]') }}
    runs-on: [self-hosted, "${{ matrix.os }}"]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates/quadcontrol-gui
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # actions/checkout 默认 `git clean -ffdx`，会把 gitignore 的 target/ 一并删掉，
      # 自托管 runner 因此每次冷编译——这个 job 曾逼近并越过 30 分钟超时。把产物目录
      # 放到 checkout 的父目录（不被清理），增量编译才真正生效。
      - name: Persist cargo output across runs
        shell: bash
        run: echo "CARGO_TARGET_DIR=$(dirname "$GITHUB_WORKSPACE")/cargo-target" >> "$GITHUB_ENV"

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # ayatana 版是 Tauri v2 的官方前置依赖；旧的 libappindicator3-dev 与之冲突。
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Tauri CLI
        run: npm install

      - name: Compile Tauri application
        run: npm run tauri -- build --no-bundle
