name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 跑在本机自托管 runner 上（私有仓库不计 Actions 分钟）：
#   qc-ubuntu = 本地 Ubuntu 22.04 arm64 虚拟机，qc-macos = 本机 macOS arm64。
# PR 只跑 ubuntu；push main 与手动触发跑 ubuntu + macOS。
# Windows 暂无本地 runner，全矩阵里已移除——Windows 验证（含 G2 Job Object 真机）
# 仍待 Actions 配额恢复或接入 Windows 主机后补。
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["qc-ubuntu"]' || '["qc-ubuntu", "qc-macos"]') }}
    runs-on: [self-hosted, "${{ matrix.os }}"]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Validate workspace metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Check formatting
        if: matrix.os == 'qc-ubuntu'
        run: cargo fmt --all --check

      - name: Run Clippy
        if: matrix.os == 'qc-ubuntu'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

  gui:
    name: GUI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["qc-ubuntu"]' || '["qc-ubuntu", "qc-macos"]') }}
    runs-on: [self-hosted, "${{ matrix.os }}"]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/quadcontrol-gui
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # ayatana 版是 Tauri v2 的官方前置依赖；旧的 libappindicator3-dev 与之冲突。
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Tauri CLI
        run: npm install

      - name: Compile Tauri application
        run: npm run tauri -- build --no-bundle
