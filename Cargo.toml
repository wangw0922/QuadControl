[workspace]
exclude = ["crates/quadcontrol-gui/src-tauri"]
members = [
  "crates/core", "crates/protocol", "crates/transport", "crates/crypto",
  "crates/media", "crates/pairing", "crates/diagnostics", "crates/ffi",
  "agents/android-shell/adb-probe",
  "crates/quadcontrol-android",
  "crates/quadcontrol-process",
