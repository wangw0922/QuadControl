name: QuadControlIOS
# Source manifest only. Generate with XcodeGen on a Mac with full Xcode; this
# repository does not include or claim to have generated an .xcodeproj.
options:
  minimumXcodeGenVersion: 2.38.0
  developmentLanguage: en
# Simplified Chinese is a product requirement for every client UI; the .lproj
# folders under Sources are picked up as localized variant groups.

packages:
  QuadControl:
    path: ../..
targets:
  QuadControlIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangw0922.quadcontrol.diagnostic
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: QuadControl
        product: QuadControlDiagnosticProtocol
      - package: QuadControl
        product: QuadControlDiagnosticTransport
  QuadControlIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wangw0922.quadcontrol.diagnostic.tests
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: QuadControlIOS
schemes:
  QuadControlIOS:
    build:
      targets:
        QuadControlIOS: all
        QuadControlIOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuadControlIOSTests
